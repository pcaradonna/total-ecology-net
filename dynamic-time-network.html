<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Time Network — Total Ecology</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Menlo, Monaco, Consolas, 'Courier New', monospace;
    }


    #info-panel {
      position: fixed;
      top: 2rem;
      left: 2.5rem;
      z-index: 10;
      max-width: 260px;
    }

    #info-toggle {
      background: none;
      border: 1px solid #333;
      color: #666;
      font-family: Menlo, Monaco, Consolas, 'Courier New', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 9px;
      cursor: pointer;
    }

    #info-toggle:hover { border-color: #666; color: #aaa; }

    #info-body {
      display: none;
      margin-top: 0.6rem;
      font-size: 0.58rem;
      color: #666;
      letter-spacing: 0.02em;
      line-height: 1.7;
      border: 1px solid #222;
      padding: 12px 14px;
      background: rgba(0,0,0,0.85);
    }

    #info-body.open { display: block; }
    #info-body em { font-style: italic; color: #888; }

    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #line-canvas {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 2;
    }

    #fg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    .sp-label-bg {
      position: absolute;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-size: 0.62rem;
      letter-spacing: 0.02em;
      padding: 5px 10px;
      background: transparent;
      border: 1px solid transparent;
      color: #2a2a2a;
      pointer-events: none;
      user-select: none;
    }

    .sp-label-fg {
      position: absolute;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-size: 0.62rem;
      letter-spacing: 0.02em;
      padding: 5px 10px;
      background: #080808;
      border: 1px solid #444;
      color: #fff;
      opacity: 0;
      filter: none;
      transition: opacity 8s ease, filter 8s ease;
      pointer-events: none;
      user-select: none;
    }

    .sp-label-fg.connected {
      opacity: 1;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5))
              drop-shadow(0 0 14px rgba(255, 255, 255, 0.2));
    }


    footer {
      position: fixed;
      bottom: 1.6rem;
      right: 2.5rem;
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #222;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>


  <div id="info-panel">
    <button id="info-toggle">about</button>
    <div id="info-body">
      <em>Bumble bee–plant interaction networks</em><br>
      Rocky Mountain Biological Laboratory<br>
      Colorado · 2019<br><br>
      Species drift through space. Connections form and dissolve as the season
      progresses from snowmelt to frost.<br><br>
      Each node is a species. Each line is an observed interaction.
    </div>
  </div>

  <div id="bg-canvas"></div>
  <canvas id="line-canvas"></canvas>
  <div id="fg-canvas"></div>


  <footer>total-ecology.net</footer>

  <script src="assets/bumble-network-data.js"></script>
  <script>
    // ── Constants ─────────────────────────────────────────────────────────────

    const DISSOLVE_MS = 6000;   // line fade duration in ms
    const MARGIN      = 0.10;   // boundary margin (normalized)

    // ── Dataset (single year, looped) ─────────────────────────────────────────

    const LOOP_YEAR = 2019;
    const TOP_BEES  = new Set([
      'bee_flavifrons', 'bee_bifarius',   'bee_appositus',  'bee_rufocinctus',
      'bee_insularis',  'bee_mixtus',     'bee_sylvicola',  'bee_occidentalis',
      'bee_nevadensis', 'bee_californicus'
    ]);
    const species = networkData.species.filter(sp =>
      sp.type === 'plant' || TOP_BEES.has(sp.id)
    );
    const weeks = networkData.weeks
      .filter(w => w.year === LOOP_YEAR)
      .map(w => ({
        ...w,
        interactions: w.interactions.filter(([a, b]) =>
          !(a.startsWith('bee_') && !TOP_BEES.has(a)) &&
          !(b.startsWith('bee_') && !TOP_BEES.has(b))
        )
      }));

    // ── State ─────────────────────────────────────────────────────────────────

    let W = window.innerWidth;
    let H = window.innerHeight;

    const pos = {};  // id → {x, y, vx, vy}  (normalized 0–1)
    let weekIdx   = 0;
    let weekTimer = null;
    const speed   = 4000;

    // Line states for canvas drawing: key → { startOpacity, targetOpacity, startTime }
    const lineStates = new Map();

    let ctx;

    // ── Canvas setup ──────────────────────────────────────────────────────────

    function setupCanvas() {
      const canvas = document.getElementById('line-canvas');
      canvas.width  = W;
      canvas.height = H;
      ctx = canvas.getContext('2d');
      window.addEventListener('resize', () => {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width  = W;
        canvas.height = H;
      });
    }

    // ── Initialize positions ──────────────────────────────────────────────────

    function initPositions() {
      species.forEach(sp => {
        pos[sp.id] = {
          x:     0.15 + Math.random() * 0.70,
          y:     0.15 + Math.random() * 0.70,
          angle: Math.random() * Math.PI * 2,
          speed: 0.000038 + Math.random() * 0.000025
        };
      });
    }

    // ── Build labels (background + foreground pairs) ──────────────────────────

    function buildLabels() {
      const bg = document.getElementById('bg-canvas');
      const fg = document.getElementById('fg-canvas');
      bg.innerHTML = '';
      fg.innerHTML = '';
      species.forEach(sp => {
        const name = sp.type === 'pollinator' ? sp.name.replace('B. ', 'Bombus ') : sp.name;

        const bgEl = document.createElement('div');
        bgEl.id          = 'bg-' + sp.id;
        bgEl.className   = 'sp-label-bg';
        bgEl.textContent = name;
        bg.appendChild(bgEl);

        const fgEl = document.createElement('div');
        fgEl.id          = 'fg-' + sp.id;
        fgEl.className   = 'sp-label-fg';
        fgEl.textContent = name;
        fg.appendChild(fgEl);
      });
    }

    // ── Physics tick ──────────────────────────────────────────────────────────

    function physicsTick() {
      Object.keys(pos).forEach(id => {
        const p = pos[id];
        let {x, y, angle, speed} = p;

        // Slowly curve the heading (correlated random walk — smooth arcs, no jitter)
        angle += (Math.random() - 0.5) * 0.010;

        // Steer away from margins — smoothly bend heading toward center
        if (x < MARGIN || x > 1 - MARGIN || y < MARGIN || y > 1 - MARGIN) {
          const toCenter = Math.atan2(0.5 - y, 0.5 - x);
          let diff = toCenter - angle;
          while (diff >  Math.PI) diff -= 2 * Math.PI;
          while (diff < -Math.PI) diff += 2 * Math.PI;
          angle += diff * 0.025;
        }

        x = Math.max(0.03, Math.min(0.97, x + Math.cos(angle) * speed));
        y = Math.max(0.03, Math.min(0.97, y + Math.sin(angle) * speed));

        pos[id] = {x, y, angle, speed};
      });

      render();
    }

    // ── Line opacity helper ───────────────────────────────────────────────────

    function getLineOpacity(state) {
      const t = Math.min(1, (Date.now() - state.startTime) / DISSOLVE_MS);
      return state.startOpacity + (state.targetOpacity - state.startOpacity) * t;
    }

    // ── Render ────────────────────────────────────────────────────────────────

    function render() {
      // Update label positions (both layers)
      species.forEach(sp => {
        const p  = pos[sp.id];
        const bg = document.getElementById('bg-' + sp.id);
        const fg = document.getElementById('fg-' + sp.id);
        const left = (p.x * 100) + '%';
        const top  = (p.y * 100) + '%';
        if (bg) { bg.style.left = left; bg.style.top = top; }
        if (fg) { fg.style.left = left; fg.style.top = top; }
      });

      // Draw lines on canvas
      ctx.clearRect(0, 0, W, H);
      const toDelete = [];
      lineStates.forEach((state, key) => {
        const opacity = getLineOpacity(state);
        if (opacity <= 0.004 && state.targetOpacity === 0) {
          toDelete.push(key);
          return;
        }
        const sep = key.indexOf('|||');
        const a   = key.slice(0, sep);
        const b   = key.slice(sep + 3);
        const pa  = pos[a], pb = pos[b];
        if (!pa || !pb) return;
        ctx.beginPath();
        ctx.moveTo(pa.x * W, pa.y * H);
        ctx.lineTo(pb.x * W, pb.y * H);
        ctx.strokeStyle = `rgba(255,255,255,${opacity.toFixed(3)})`;
        ctx.lineWidth   = 2.5;
        ctx.stroke();
      });
      toDelete.forEach(k => lineStates.delete(k));
    }

    // ── Week update ───────────────────────────────────────────────────────────

    function setWeek(idx) {
      weekIdx = idx;
      const now  = Date.now();
      const week = weeks[weekIdx];

      // Build new interaction key set
      const newKeys      = new Set();
      const connectedIds = new Set();
      week.interactions.forEach(pair => {
        const key = pair[0] + '|||' + pair[1];
        newKeys.add(key);
        connectedIds.add(pair[0]);
        connectedIds.add(pair[1]);
      });

      // Fade out lines leaving this week
      lineStates.forEach((state, key) => {
        if (!newKeys.has(key)) {
          const cur = getLineOpacity(state);
          lineStates.set(key, { startOpacity: cur, targetOpacity: 0, startTime: now });
        }
      });

      // Fade in new lines (or reverse a fade-out)
      newKeys.forEach(key => {
        const existing = lineStates.get(key);
        if (!existing) {
          lineStates.set(key, { startOpacity: 0, targetOpacity: 1, startTime: now });
        } else if (existing.targetOpacity === 0) {
          const cur = getLineOpacity(existing);
          lineStates.set(key, { startOpacity: cur, targetOpacity: 1, startTime: now });
        }
      });

      // Update foreground label visibility (no DOM moves — transitions fire correctly)
      species.forEach(sp => {
        const fg = document.getElementById('fg-' + sp.id);
        if (fg) fg.classList.toggle('connected', connectedIds.has(sp.id));
      });

    }

    // ── Week timer (looping) ──────────────────────────────────────────────────

    const SEASON_FADE_MS = 8000;

    function fadeOutAndRestart() {
      // Fade all active lines to zero
      const now = Date.now();
      lineStates.forEach((state, key) => {
        lineStates.set(key, { startOpacity: getLineOpacity(state), targetOpacity: 0, startTime: now });
      });
      // Fade all active fg labels
      species.forEach(sp => {
        const fg = document.getElementById('fg-' + sp.id);
        if (fg) fg.classList.remove('connected');
      });
      // After fade completes, restart cleanly
      weekTimer = setTimeout(() => {
        lineStates.clear();
        setWeek(0);
        scheduleNextWeek();
      }, SEASON_FADE_MS + 200);
    }

    function scheduleNextWeek() {
      const nextIdx = (weekIdx + 1) % weeks.length;
      weekTimer = setTimeout(() => {
        if (nextIdx === 0) {
          fadeOutAndRestart();
        } else {
          setWeek(nextIdx);
          scheduleNextWeek();
        }
      }, speed);
    }

    document.getElementById('info-toggle').addEventListener('click', () => {
      document.getElementById('info-body').classList.toggle('open');
    });

    // ── Boot ──────────────────────────────────────────────────────────────────

    setupCanvas();
    initPositions();
    buildLabels();
    setWeek(0);
    scheduleNextWeek();
    (function loop() { physicsTick(); requestAnimationFrame(loop); })();
  </script>

</body>
</html>
